# Phase 2 acceptance, part 2: meanwhile the manager renamed "Install countertop" (another field).
# Back online, the outbox goes out and the rename comes in: both edits survive.
appId: dev.dirlocal.demo
---
- tapOn:
    id: network-toggle
- extendedWaitUntil:
    visible: 'Up to date · [0-9]+ tasks' # nothing left unsent
    timeout: 30000
- extendedWaitUntil:
    visible: '.*Install quartz countertop.*in progress.*'
    timeout: 15000
- extendedWaitUntil:
    visible: '.*Photo attached.*Photo task.*'
    timeout: 15000
